<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="darkreader-lock">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="%BASE_URL%favicon.ico?v=20260906-transparent">
    <link rel="icon" type="image/svg+xml" sizes="any" href="%BASE_URL%favicon.svg?v=20260906-transparent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Overt</title>
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('now.darkMode')
          var isDark = raw ? JSON.parse(raw) === true : false
          document.documentElement.classList.toggle('dark', isDark)
        } catch (error) {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
